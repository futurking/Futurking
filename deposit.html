<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Future King - Deposit</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            min-height: 100vh;
            padding: 25px 15px;
        }

        .deposit-box {
            max-width: 420px;
            margin: 30px auto;
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.10);
        }

        h2 {
            text-align: center;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 7px;
            font-weight: bold;
        }

        select,
        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 16px;
        }

        input[readonly] {
            background: #f1f1f1;
        }

        .merchant {
            margin-top: 18px;
            padding: 15px;
            background: #f5f5f5;
            border-radius: 8px;
        }

        .merchant-title {
            font-size: 13px;
            color: #777;
        }

        .merchant-name {
            font-size: 19px;
            font-weight: bold;
            margin-top: 5px;
        }

        button {
            width: 100%;
            margin-top: 22px;
            padding: 14px;
            border: none;
            border-radius: 8px;
            background: #111;
            color: white;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            opacity: 0.9;
        }

        .message {
            text-align: center;
            margin-top: 15px;
            font-weight: bold;
        }
    </style>
</head>

<body>

<div class="deposit-box">

    <h2>Deposit</h2>

    <label for="package">Select Package</label>
    <select id="package" onchange="updateAmount()">
        <option value="1000">1000 PKR</option>
        <option value="5000">5000 PKR</option>
        <option value="10000">10000 PKR</option>
        <option value="20000">20000 PKR</option>
        <option value="30000">30000 PKR</option>
        <option value="40000">40000 PKR</option>
        <option value="50000">50000 PKR</option>
    </select>

    <div class="merchant">
        <div class="merchant-title">Merchant Account</div>
        <div class="merchant-name">Future King</div>
    </div>

    <label for="amount">Deposit Amount</label>
    <input type="number" id="amount" value="1000" readonly>

    <label for="pin">Security PIN</label>
    <input type="password" id="pin" placeholder="Enter your PIN" maxlength="6">

    <button onclick="confirmDeposit()">Confirm Deposit</button>

    <div class="message" id="message"></div>

</div>

<script>
    function updateAmount() {
        const packageAmount = document.getElementById("package").value;
        document.getElementById("amount").value = packageAmount;
    }

    function confirmDeposit() {
        const packageAmount = document.getElementById("package").value;
        const pin = document.getElementById("pin").value;
        const message = document.getElementById("message");

        if (pin === "") {
            message.innerHTML = "Please enter your Security PIN.";
            return;
        }

        message.innerHTML =
            "Payment system will be connected here.";
    }
</script>

</body>
</html>
