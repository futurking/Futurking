<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Future King - Deposit</title>
<link rel="stylesheet" href="style.css">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>

<div class="dashboard">

<div class="deposit-card">

<h2 class="deposit-title">💳 Deposit</h2>

<div class="deposit-info">
<h3>Minimum Deposit: Rs.1000</h3>
<p>Select a package and confirm with your PIN</p>
</div>

<label>Select Investment Package</label>

<select id="package">
<option value="">Select Package</option>
<option value="1000">Starter - Rs.1000</option>
<option value="5000">Silver - Rs.5000</option>
<option value="10000">Gold - Rs.10000</option>
<option value="20000">Diamond - Rs.20000</option>
<option value="30000">Premium - Rs.30000</option>
<option value="50000">VIP - Rs.50000</option>
</select>

<label>Deposit Amount</label>

<input
type="number"
id="amount"
placeholder="Enter Amount"
min="1000"
>

<label>Security PIN</label>

<input
type="password"
id="pin"
placeholder="Enter 4 Digit PIN"
maxlength="4"
inputmode="numeric"
>

<button class="submit-btn" onclick="makeDeposit()">
Confirm Deposit
</button>

<p id="message" style="text-align:center;margin-top:15px;"></p>

<a href="dashboard.html" style="display:block;margin-top:15px;">
<button type="button" class="submit-btn">
⬅ Back to Dashboard
</button>
</a>

</div>

</div>

<script>

const SUPABASE_URL =
"https://xwusgqmmiqeqwjolzzxs.supabase.co";

const SUPABASE_KEY =
"sb_publishable_-sjT4sYJXqM_sPba4DCNbw_Cyh-kSfG";

const supabaseClient =
supabase.createClient(SUPABASE_URL, SUPABASE_KEY);


async function makeDeposit(){

const packageAmount =
Number(document.getElementById("package").value);

const amount =
Number(document.getElementById("amount").value);

const pin =
document.getElementById("pin").value;

const message =
document.getElementById("message");


if(!packageAmount){
message.innerText =
"Please select a package.";
return;
}

if(amount !== packageAmount){
message.innerText =
"Amount must match the selected package.";
return;
}

if(amount < 1000){
message.innerText =
"Minimum deposit is Rs.1000.";
return;
}

if(!/^\d{4}$/.test(pin)){
message.innerText =
"Please enter a 4 digit PIN.";
return;
}


message.innerText = "Processing...";


const { data: { user } } =
await supabaseClient.auth.getUser();


if(!user){

message.innerText =
"Please login first.";

return;
}


const { data, error } =
await supabaseClient.rpc(
"make_deposit",
{
p_user_id: user.id,
p_amount: amount,
p_pin: pin,
p_package_amount: packageAmount
}
);


if(error){

message.innerText =
error.message;

return;
}


message.innerText =
"✅ Deposit successful! Package activated.";

setTimeout(() => {
window.location.href =
"dashboard.html";
},1500);

}

</script>

</body>
</html>
