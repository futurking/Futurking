<!DOCTYPE html>
<html>
<head>
<title>Deposit</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="plan-card">

<h2>💳 Deposit</h2>

<p>Minimum Deposit: Rs.1000</p>

<h3>Select Package</h3>

<select>
<option>Select Package</option>
<option>Starter - Rs.1000</option>
<option>Silver - Rs.5000</option>
<option>Gold - Rs.10000</option>
<option>Diamond - Rs.20000</option>
<option>Premium - Rs.30000</option>
<option>VIP - Rs.50000</option>
</select>

<h3>Payment Method</h3>

<select>
<option>Select Method</option>
<option>Easypaisa</option>
<option>JazzCash</option>
</select>

<input type="number" placeholder="Enter Amount">

<input type="text" placeholder="Transaction ID">

<button>Submit Deposit</button>

</div>

</body>
</html>
