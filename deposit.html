<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Future King - Deposit</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            min-height: 100vh;
            padding: 25px 15px;
        }

        .deposit-box {
            max-width: 420px;
            margin: 30px auto;
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.10);
        }

        h2 {
            text-align: center;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 7px;
            font-weight: bold;
        }

        select,
        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 16px;
        }

        input[readonly] {
            background: #f1f1f1;
        }

        .merchant {
            margin-top: 18px;
            padding: 15px;
            background: #f5f5f5;
            border-radius: 8px;
        }

        .merchant-title {
            font-size: 13px;
            color: #777;
        }

        .merchant-name {
            font-size: 19px;
            font-weight: bold;
            margin-top: 5px;
        }

        .payment-methods {
            display: flex;
            gap: 10px;
        }

        .payment-methods label {
            flex: 1;
            margin: 0;
            padding: 13px;
            border: 1px solid #ccc;
            border-radius: 8px;
            text-align: center;
            cursor: pointer;
        }

        .payment-methods input {
            width: auto;
            margin-right: 6px;
        }

        button {
            width: 100%;
            margin-top: 22px;
            padding: 14px;
            border: none;
            border-radius: 8px;
            background: #111;
            color: white;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            opacity: 0.9;
        }

        .message {
            text-align: center;
            margin-top: 15px;
            font-weight: bold;
        }
    </style>
</head>

<body>

<div class="deposit-box">

    <h2>Deposit</h2>

    <label for="package">Select Package</label>
    <select id="package" onchange="updateAmount()">
        <option value="1000">1000 PKR</option>
        <option value="5000">5000 PKR</option>
        <option value="10000">10000 PKR</option>
        <option value="20000">20000 PKR</option>
        <option value="30000">30000 PKR</option>
        <option value="40000">40000 PKR</option>
        <option value="50000">50000 PKR</option>
    </select>

    <div class="merchant">
        <div class="merchant-title">Merchant Account</div>
        <div class="merchant-name">Future King</div>
    </div>

    <label for="amount">Deposit Amount</label>
    <input type="number" id="amount" value="1000" readonly>

    <label>Payment Method</label>

    <div class="payment-methods">
        <label>
            <input type="radio" name="payment" value="easypaisa" checked>
            Easypaisa
        </label>

        <label>
            <input type="radio" name="payment" value="jazzcash">
            JazzCash
        </label>
    </div>

    <label for="accountNumber">Your Account Number</label>
    <input
        type="tel"
        id="accountNumber"
        placeholder="03XXXXXXXXX"
        maxlength="11"
    >

    <button onclick="payNow()">Pay Now</button>

    <div class="message" id="message"></div>

</div>

<script>

    function updateAmount() {
        const packageAmount = document.getElementById("package").value;
        document.getElementById("amount").value = packageAmount;
    }

    function payNow() {

        const packageAmount = document.getElementById("package").value;
        const accountNumber = document.getElementById("accountNumber").value;
        const paymentMethod = document.querySelector(
            'input[name="payment"]:checked'
        ).value;

        const message = document.getElementById("message");

        if (accountNumber.length !== 11) {
            message.innerHTML =
                "Please enter a valid 11-digit account number.";
            return;
        }

        message.innerHTML =
            "Payment request is being prepared...";

        /*
         * IMPORTANT:
         * Actual Easypaisa/JazzCash payment will be connected here.
         *
         * The payment provider will handle the secure
         * payment authorization.
         *
         * After successful payment verification,
         * the selected package will be activated.
         */

        console.log("Package:", packageAmount);
        console.log("Payment Method:", paymentMethod);
        console.log("Account:", accountNumber);
    }

</script>

</body>
</html>
