<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Future King - Deposit</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="dashboard">

<div class="deposit-card">

<h2 class="deposit-title">💳 Deposit Funds</h2>

<div class="deposit-info">
<h3>Minimum Deposit: Rs.1000</h3>
<p>Select your investment package</p>
</div>

<label>Select Investment Package</label>

<select>
<option>Select Package</option>
<option>Starter - Rs.1000</option>
<option>Silver - Rs.5000</option>
<option>Gold - Rs.10000</option>
<option>Diamond - Rs.20000</option>
<option>Premium - Rs.30000</option>
<option>VIP - Rs.50000</option>
</select>

<label>Payment Method</label>

<select>
<option>Select Payment Method</option>
<option>Easypaisa</option>
<option>JazzCash</option>
</select>

<div class="payment-box">
<h3>Payment Details</h3>
<p><strong>Account Name:</strong> Future King</p>
<p><strong>Easypaisa:</strong> 03XXXXXXXXX</p>
<p><strong>JazzCash:</strong> 03XXXXXXXXX</p>
</div>

<label>Deposit Amount</label>

<input type="number" placeholder="Enter Deposit Amount">

<label>Security PIN</label>

<input type="password" placeholder="Enter 4 Digit PIN" maxlength="4">

<button class="submit-btn">Submit Deposit</button>

<a href="dashboard.html" style="display:block; margin-top:15px;">
<button type="button" class="submit-btn">⬅ Back to Dashboard</button>
</a>

</div>

</div>

</body>
</html>
