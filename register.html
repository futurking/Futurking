<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Future King - Register</title>
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>

<div class="register-page">

<div class="register-card">

<div class="logo">
<div class="crown">👑</div>
<h1>Future King</h1>
<p>Create your account</p>
</div>

<div class="input-box">
<input type="text" id="name" placeholder="Full Name">
</div>

<div class="input-box">
<input type="email" id="email" placeholder="Email Address">
</div>

<div class="input-box">
<input type="password" id="password" placeholder="Password">
</div>

<div class="input-box">
<input type="password" id="pin" placeholder="4 Digit Security PIN" maxlength="4" inputmode="numeric">
</div>

<button class="main-btn" onclick="registerUser()">
Create Account
</button>

<p id="message" class="bottom-text"></p>

<p class="bottom-text">
Already have an account?
<a href="login.html">Login</a>
</p>

</div>

</div>

<script>

const SUPABASE_URL =
"https://xwusgqmmiqeqwjolzzxs.supabase.co";

const SUPABASE_KEY =
"sb_publishable_-sjT4sYJXqM_sPba4DCNbw_Cyh-kSfG";

const supabaseClient =
supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);

async function registerUser(){

const name =
document.getElementById("name").value.trim();

const email =
document.getElementById("email").value.trim();

const password =
document.getElementById("password").value;

const pin =
document.getElementById("pin").value;

const message =
document.getElementById("message");

if(!name || !email || !password || !pin){
message.innerText =
"Please fill all fields.";
return;
}

if(!/^\d{4}$/.test(pin)){
message.innerText =
"PIN must be exactly 4 digits.";
return;
}

message.innerText =
"Creating account...";

const { data, error } =
await supabaseClient.auth.signUp({
email: email,
password: password
});

if(error){
message.innerText =
error.message;
return;
}

if(!data.user){
message.innerText =
"Registration failed.";
return;
}

const { error: profileError } =
await supabaseClient
.from("profiles")
.insert({
user_id: data.user.id,
full_name: name,
balance: 0,
pin: pin
});

if(profileError){
message.innerText =
profileError.message;
return;
}

message.innerText =
"✅ Account created successfully!";

setTimeout(() => {
window.location.href =
"dashboard.html";
},1500);

}

</script>

</body>
</html>
